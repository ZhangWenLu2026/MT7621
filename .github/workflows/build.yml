name: build-openwrt-rn1150w

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'files/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get purge -y 'dotnet*' 'aspnetcore*' '^mongodb-.*' '^mysql-.*' 'llvm*' 'temurin*' || true
          df -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev file wget

      - name: 拉取 OpenWrt 24.10
        run: |
          git clone --depth=1 -b openwrt-24.10 https://github.com/openwrt/openwrt.git owwrt

      - name: 注入机型
        run: |
          cp src/mt7621_tg_rn1150w.dts owwrt/target/linux/ramips/dts/
          cat src/mt7621.mk.append >> owwrt/target/linux/ramips/image/mt7621.mk
          mkdir -p owwrt/files
          cp -r files/etc owwrt/files/
          cd owwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_tg_rn1150w=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          EOF
          make defconfig
          grep -E "DEVICE_tg_rn1150w|PACKAGE_luci=" .config || true

      - name: 下载源码包
        run: |
          cd owwrt
          make -j8 download V=s

      - name: 编译
        run: |
          cd owwrt
          make -j$(nproc) V=s

      - name: 列出产物
        run: ls -l owwrt/bin/targets/ramips/mt7621/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: rn1150w-firmware
          path: |
            owwrt/bin/targets/ramips/mt7621/*tg_rn1150w*
          if-no-files-found: error
