name: publish-firmware

# 作用：把 build 的 artifact 挂到 Release 上，这样不用登录 GitHub 也能直接下载固件
# 触发：build 流程跑完之后自动发布；也可以手动指定 run_id
on:
  workflow_run:
    workflows: ["build-openwrt-rn1150w", "build-openwrt-rn1150w-vanilla"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '要发布的 build run id'
        required: false
        default: '45517525047'

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id || '45517525047' }}
          ART: ${{ github.event.workflow_run.name == 'build-openwrt-rn1150w-vanilla' && 'rn1150w-vanilla' || 'rn1150w-firmware' }}
        run: |
          gh run download "$RUN_ID" -n "$ART" -D out --repo "${{ github.repository }}"
          echo "--- files ---"
          find out -type f -printf '%p  %s bytes\n'

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id || '45517525047' }}
          KIND: ${{ github.event.workflow_run.name == 'build-openwrt-rn1150w-vanilla' && 'vanilla' || 'luci' }}
        run: |
          TAG="fw-${KIND}-${RUN_ID}"
          gh release delete "$TAG" --yes --repo "${{ github.repository }}" || true
          gh release create "$TAG" $(find out -type f) \
            --repo "${{ github.repository }}" \
            --title "OpenWrt 24.10 ${KIND} - $RUN_ID" \
            --notes "由 build run $RUN_ID 的 artifact 自动发布。刷机用 *-squashfs-sysupgrade.bin。"
